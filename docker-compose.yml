services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://ledger:ledger@postgres:5432/ledger?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-compose-secret-1234567890
      # Local dev convenience only — never a real deploy value. Seeds a
      # login-capable admin@ledger.local user with this password. Omit this
      # var entirely for a real deploy; see README for details.
      ADMIN_PASSWORD: local-dev-only-change-me
    ports: ['3000:3000']

services:
  - type: web
    name: ledger-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: ledger-db, property: connectionString }
      # Redis NÃO é declarado neste blueprint (Render só permite um recurso gerenciado
      # no free tier, usado aqui pelo Postgres). Provisione separadamente — Render Key
      # Value/Redis ou um provedor externo como Upstash — e cole a connection string em
      # REDIS_URL no painel do serviço ledger-api. `sync: false` faz o Render pedir o
      # valor no deploy e preservá-lo, em vez de tentar resolver um serviço inexistente.
      - key: REDIS_URL
        sync: false
      # Opcional: define no dashboard do Render para provisionar um admin
      # login-capable (admin@ledger.local); sem ela só a treasury é seedada.
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: ledger-db
    plan: free

services:
  - type: web
    name: ledger-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: ledger-db, property: connectionString }
      # Redis: crie um serviço Redis free no painel Render (ou use Upstash) e
      # ligue a connection string na env var REDIS_URL do serviço ledger-api.
      - key: REDIS_URL
        fromService: { name: ledger-redis, type: keyvalue, property: connectionString }
databases:
  - name: ledger-db
    plan: free

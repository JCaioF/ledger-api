services:
  - type: web
    name: ledger-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: ledger-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: ledger-redis, type: redis, property: connectionString }
databases:
  - name: ledger-db
    plan: free
services_redis_note: 'Criar um Redis free no painel Render e ligar em REDIS_URL, ou usar Upstash.'

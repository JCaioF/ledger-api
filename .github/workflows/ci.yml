name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ledger, POSTGRES_PASSWORD: ledger, POSTGRES_DB: ledger_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://ledger:ledger@localhost:5432/ledger_test?schema=public
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-secret-value-1234567890
      AUTH_RATE_MAX: '3'
      TRANSFER_RATE_MAX: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # Advisory, não bloqueante: o único high/critical hoje é `tar`, alcançado via
      # `@mapbox/node-pre-gyp` (dependência de build do argon2), e só some com um
      # major do argon2 — bump arriscado num módulo nativo de hash de senha. O step
      # deixa o relatório visível no log a cada run sem deixar o CI vermelho de
      # origem; vire `continue-on-error: false` quando o argon2 for atualizado.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage }
      - run: npm run build
